<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1414 2000" width="3508" height="4961" role="img" aria-label="Диспансеризация для ветеранов боевых действий — участников СВО">
  <title>Диспансеризация для ветеранов боевых действий — участников СВО</title>
  <defs>
    <style>
      .ff { font-family: "PT Sans", "Arial", "Helvetica Neue", Helvetica, sans-serif; }
      .title { font-weight: 700; font-size: 63px; fill: #ffffff; letter-spacing: 0.5px; }
      .num   { font-weight: 700; font-size: 66px; fill: #2ba7a3; text-anchor: middle; }
      .body  { font-size: 27.5px; fill: #16202b; }
      .foot  { font-weight: 700; font-size: 29px; fill: #ffffff; }
    </style>
    <clipPath id="leftPanelClip"><rect x="45" y="0" width="726" height="1796"/></clipPath>
  </defs>

  <rect width="1414" height="2000" fill="#ffffff"/>

  <!-- Светлая подложка правой колонки -->
  <rect x="786" y="480" width="574" height="1314" fill="#edf3f7"/>

  <!-- Голубое пятно вокруг иллюстрации со стетоскопом -->
  <path d="M1000 22 C1180 22 1338 60 1338 210 C1338 350 1250 470 1090 470 C930 470 840 400 840 268 C840 120 880 22 1000 22 Z" fill="#e2ecf4"/>

  <!-- Сердце -->
  <path d="M948 236 C860 168 828 128 828 92 C828 56 856 34 888 34 C912 34 934 47 948 68 C962 47 984 34 1008 34 C1040 34 1068 56 1068 92 C1068 128 1036 168 948 236 Z" fill="#e8433f"/>

  <!-- Стетоскоп -->
  <g fill="none" stroke="#231f20" stroke-width="15" stroke-linecap="round">
    <path d="M980 148 C1055 190 1090 250 1090 316 C1090 372 1132 404 1176 404 C1220 404 1258 372 1258 316 L1258 168"/>
    <path d="M1178 76 L1178 150"/>
    <path d="M1258 76 L1258 150"/>
  </g>
  <g fill="none" stroke="#6a7fc4" stroke-width="15" stroke-linecap="round">
    <path d="M1013 186 C1050 222 1068 262 1070 306"/>
    <path d="M1188 402 C1224 392 1250 362 1256 322"/>
    <path d="M1178 96 L1178 150"/>
    <path d="M1258 96 L1258 150"/>
  </g>
  <circle cx="1178" cy="70" r="17" fill="#f2c8bd"/>
  <circle cx="1258" cy="70" r="17" fill="#f2c8bd"/>
  <circle cx="962" cy="150" r="46" fill="#231f20"/>
  <circle cx="962" cy="150" r="34" fill="#efe0cd"/>

  <!-- Левая синяя панель -->
  <rect x="45" y="0" width="726" height="1796" fill="#5c82a8"/>

  <!-- Тёмное пятно за медсестрой -->
  <g clip-path="url(#leftPanelClip)">
    <path d="M45 900 C210 856 360 900 400 1030 C446 1180 400 1350 300 1470 C200 1590 90 1620 45 1612 Z" fill="#3c6489"/>
  </g>

  <!-- Заголовок -->
  <g class="ff">
    <text class="title" x="88" y="152">ДИСПАНСЕРИЗАЦИЯ</text>
    <text class="title" x="88" y="234">ДЛЯ ВЕТЕРАНОВ</text>
    <text class="title" x="88" y="316">БОЕВЫХ ДЕЙСТВИЙ</text>
    <text class="title" x="88" y="398">-УЧАСТНИКОВ СВО</text>
  </g>

  <!-- Медсестра -->
  <g>
    <!-- ноги -->
    <path d="M196 1180 L336 1180 L352 1400 L322 1530 L246 1524 L262 1392 L214 1516 L142 1494 L182 1352 Z" fill="#4fb0a4"/>
    <path d="M262 1392 L246 1524 L322 1530 L352 1400 Z" fill="#3f9a90"/>
    <!-- обувь -->
    <path d="M240 1516 L326 1522 L330 1560 C330 1574 320 1582 300 1582 L236 1582 C224 1582 220 1572 224 1560 Z" fill="#d8f0ea"/>
    <path d="M134 1486 L206 1508 L196 1546 C192 1560 180 1566 162 1560 L104 1542 C92 1538 90 1526 98 1516 Z" fill="#d8f0ea"/>
    <!-- торс -->
    <path d="M198 1010 C198 984 224 968 262 968 C300 968 328 984 328 1010 L346 1196 L184 1196 Z" fill="#d4f0e8"/>
    <path d="M262 968 L288 1026 L262 1060 L236 1026 Z" fill="#5c82a8"/>
    <!-- руки -->
    <path d="M200 1016 L172 1140 L200 1174 L226 1160 L206 1120 L226 1024 Z" fill="#d4f0e8"/>
    <path d="M326 1016 L354 1140 L326 1174 L300 1160 L320 1120 L300 1024 Z" fill="#d4f0e8"/>
    <path d="M172 1148 C186 1148 196 1158 196 1172 C196 1186 186 1194 172 1194 C158 1194 148 1186 148 1172 C148 1158 158 1148 172 1148 Z" fill="#c98e6b"/>
    <path d="M354 1148 C368 1148 378 1158 378 1172 C378 1186 368 1194 354 1194 C340 1194 330 1186 330 1172 C330 1158 340 1148 354 1148 Z" fill="#c98e6b"/>
    <!-- шея и голова -->
    <rect x="242" y="936" width="40" height="44" fill="#b87f5e"/>
    <ellipse cx="262" cy="890" rx="60" ry="66" fill="#c98e6b"/>
    <path d="M202 886 C202 826 226 796 264 796 C304 796 322 828 322 878 L322 848 C302 838 262 836 232 852 C214 862 206 876 202 900 Z" fill="#3b2b26"/>
    <path d="M312 856 C334 872 336 916 328 962 C320 1002 306 1016 296 1010 C288 1004 300 976 302 940 C304 906 300 872 312 856 Z" fill="#3b2b26"/>
    <path d="M258 782 C272 776 282 782 284 792 C276 786 266 786 258 790 Z" fill="#3b2b26"/>
    <circle cx="234" cy="888" r="6" fill="#231f20"/>
    <!-- маска -->
    <path d="M212 892 C238 906 288 906 314 892 C316 936 296 962 262 962 C228 962 210 936 212 892 Z" fill="#a8dae0"/>
    <path d="M212 900 L196 908 M314 900 L330 908" stroke="#a8dae0" stroke-width="8" fill="none"/>
    <!-- поднос с флаконами -->
    <g>
      <rect x="150" y="1176" width="238" height="18" rx="5" fill="#2f2f2f"/>
      <g fill="#d8f0ea" stroke="#2f2f2f" stroke-width="4">
        <rect x="182" y="1132" width="26" height="44" rx="4"/>
        <rect x="220" y="1132" width="26" height="44" rx="4"/>
        <rect x="258" y="1132" width="26" height="44" rx="4"/>
        <rect x="296" y="1132" width="26" height="44" rx="4"/>
      </g>
      <g fill="#4fb0a4">
        <rect x="182" y="1132" width="26" height="12"/>
        <rect x="220" y="1132" width="26" height="12"/>
        <rect x="258" y="1132" width="26" height="12"/>
        <rect x="296" y="1132" width="26" height="12"/>
      </g>
    </g>
  </g>

  <!-- Пункт 1 -->
  <circle cx="636" cy="572" r="73" fill="#ffffff"/>
  <text class="ff num" x="636" y="596">1</text>
  <g class="ff body">
    <text x="800" y="522">Для прохождения обследования нужно</text>
    <text x="800" y="562">обратиться в регистратуру или участковому</text>
    <text x="800" y="602">терапевту своей поликлиники, предъявив</text>
    <text x="800" y="642">паспорт, полис ОМС и удостоверение</text>
    <text x="800" y="682">ветерана боевых действий.</text>
  </g>

  <!-- Пункт 2 -->
  <circle cx="636" cy="936" r="73" fill="#ffffff"/>
  <text class="ff num" x="636" y="960">2</text>
  <g class="ff body">
    <text x="800" y="846">Проведение диспансеризации и</text>
    <text x="800" y="886">профилактических медицинских осмотров</text>
    <text x="800" y="926">ветеранам боевых действий-участников</text>
    <text x="800" y="966">СВО осуществляется в один день с</text>
    <text x="800" y="1006">привлечением дополнительных</text>
    <text x="800" y="1046">специалистов и методов обследования с</text>
    <text x="800" y="1086">учетом полученных травм, и повреждений</text>
  </g>

  <!-- Пункт 3 -->
  <circle cx="636" cy="1292" r="73" fill="#ffffff"/>
  <text class="ff num" x="636" y="1316">3</text>
  <g class="ff body">
    <text x="800" y="1256">Внеочередное обслуживание: Медицинская</text>
    <text x="800" y="1296">помощь и профилактические осмотры</text>
    <text x="800" y="1336">проводятся без ожидания в общей очереди</text>
  </g>

  <!-- Пункт 4 -->
  <circle cx="636" cy="1566" r="73" fill="#ffffff"/>
  <text class="ff num" x="636" y="1590">4</text>
  <g class="ff body" text-anchor="middle">
    <text x="1073" y="1476">В рамках проведения диспансеризации</text>
    <text x="1073" y="1516">ветеранов боевых действий - участников СВО</text>
    <text x="1073" y="1556">предусмотрена обязательная консультация</text>
    <text x="1073" y="1596">медицинского психолога на предмет</text>
    <text x="1073" y="1636">выраженности признаков тревожно-</text>
    <text x="1073" y="1676">депрессивных, посттравматических стрессовых</text>
    <text x="1073" y="1716">расстройств.</text>
  </g>

  <!-- Подпись внизу -->
  <g class="ff">
    <text class="foot" x="88" y="1662">ПО ВСЕМ ВОПРОСАМ МОЖЕТЕ</text>
    <text class="foot" x="88" y="1702">ОБРАТИТЬСЯ СВОЕМУ УЧАСТКОВОМУ</text>
    <text class="foot" x="88" y="1742">ТЕРАПЕВТУ</text>
  </g>
</svg>
